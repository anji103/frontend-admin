version: "3.9"

services:
  admin:
    image: localhost:4566/000000000000/us-east-1/nextjs-app:build-1
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ohmind_admin

    ports:
      - "3000:3000"

    env_file:
      - .env

    restart: unless-stopped

    networks:
      - ohmind_network

networks:
  ohmind_network:
    driver: bridge
